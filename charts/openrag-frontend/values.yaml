image: langflowai/openrag-frontend:latest
backendHost: openrag-backend
backendPort: "8000"
backendSsl: "false"
ingress:
  enabled: true
  host: ""            # empty = IP-only via LB address
  staticIpName: ""    # GKE reserved static IP name, optional
resources:
  requests: { cpu: "100m", memory: "256Mi" }
  limits: { cpu: "500m", memory: "512Mi" }
