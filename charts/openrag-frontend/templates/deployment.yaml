apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrag-frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app: openrag-frontend }
  template:
    metadata:
      labels: { app: openrag-frontend }
    spec:
      containers:
        - name: frontend
          image: {{ .Values.image }}
          ports: [{ containerPort: 3000 }]
          env:
            - { name: BACKEND_URL, value: {{ .Values.backendUrl }} }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
