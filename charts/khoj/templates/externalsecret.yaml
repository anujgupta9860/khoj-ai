{{- if .Values.jira.externalSecret.enabled }}
# The Jira API token comes from Google Secret Manager via External
# Secrets Operator - never from values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.jira.secretName }}
spec:
  refreshInterval: {{ .Values.jira.externalSecret.refreshInterval }}
  secretStoreRef:
    name: gcpsm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.jira.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: JIRA_API_TOKEN
      remoteRef: { key: {{ .Values.jira.externalSecret.gsmKey }} }
{{- end }}
{{- if .Values.auth.externalSecret.enabled }}
---
# The auth signing secret (KHOJ_AUTH_SECRET) comes from Google Secret
# Manager via External Secrets Operator - never from values. The agent
# chart syncs the same GSM key into its own secret so both services
# verify the same tokens.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.auth.secretName }}
spec:
  refreshInterval: {{ .Values.auth.externalSecret.refreshInterval }}
  secretStoreRef:
    name: gcpsm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.auth.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: KHOJ_AUTH_SECRET
      remoteRef: { key: {{ .Values.auth.externalSecret.gsmKey }} }
{{- end }}
{{- if .Values.salesforce.externalSecret.enabled }}
---
# The Salesforce credentials come from Google Secret Manager via
# External Secrets Operator - never from values. Three one-value GSM
# secrets: the Connected App client secret, the org user's password
# and the user's security token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.salesforce.secretName }}
spec:
  refreshInterval: {{ .Values.salesforce.externalSecret.refreshInterval }}
  secretStoreRef:
    name: gcpsm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.salesforce.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: SALESFORCE_CLIENT_SECRET
      remoteRef: { key: {{ .Values.salesforce.externalSecret.clientSecretGsmKey }} }
    {{- if .Values.salesforce.externalSecret.passwordGsmKey }}
    - secretKey: SALESFORCE_PASSWORD
      remoteRef: { key: {{ .Values.salesforce.externalSecret.passwordGsmKey }} }
    {{- end }}
    {{- if .Values.salesforce.externalSecret.securityTokenGsmKey }}
    - secretKey: SALESFORCE_SECURITY_TOKEN
      remoteRef: { key: {{ .Values.salesforce.externalSecret.securityTokenGsmKey }} }
    {{- end }}
{{- end }}
