apiVersion: apps/v1
kind: Deployment
metadata:
  name: khoj
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: khoj
  template:
    metadata:
      labels:
        app: khoj
    spec:
      serviceAccountName: khoj
      containers:
        - name: khoj
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: GCP_PROJECT
              value: {{ .Values.gcp.project }}
            - name: KHOJ_BUCKET
              value: {{ .Values.gcp.bucket }}
            - name: OPENRAG_URL
              value: {{ .Values.openrag.url }}
            - name: KHOJ_AGENT_URL
              value: {{ .Values.agent.url }}
            - name: FIREBASE_API_KEY
              value: {{ .Values.firebase.apiKey }}
            - name: FIREBASE_AUTH_DOMAIN
              value: {{ .Values.firebase.authDomain }}
            - name: JIRA_BASE_URL
              value: {{ .Values.jira.baseUrl | quote }}
            - name: JIRA_EMAIL
              value: {{ .Values.jira.email | quote }}
            - name: JIRA_PROJECT_KEY
              value: {{ .Values.jira.projectKey | quote }}
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jira.secretName }}
                  key: JIRA_API_TOKEN
                  # Optional: the pod must start before the GSM secret
                  # exists; the feature simply stays disabled until then.
                  optional: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/config
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
