image:
  repository: us-central1-docker.pkg.dev/innovation-lab-2026/khoj/khoj
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 1

# GCP wiring (no secrets - identity comes from Workload Identity)
gcp:
  project: innovation-lab-2026
  bucket: "khoj-ai-corpus-innovation-lab"      # GCS bucket (original files, cold copies)

# OpenRAG: the single retrieval engine (in-cluster service)
openrag:
  url: "http://openrag-backend:8000"

firebase:
  apiKey: "AIzaSyBj_VxGuj_iVjrnnjzS2g8S0zRfg4ItYX4"   # Firebase web config (public identifiers)
  authDomain: "innovation-lab-2026.firebaseapp.com"

# A2A chat agent (in-cluster address of the khoj-agent service)
agent:
  url: "http://khoj-agent"

# Jira ticket creation from chat answers (optional). EVERY Atlassian
# setting lives here in Helm values - the app only reads env. baseUrl/
# email/projectKey/issueType are plain config; the API token itself is
# the one exception: it comes from GSM via the ExternalSecret below
# (point gsmKey at the secret that holds it), never from values.
# Empty baseUrl = feature off.
jira:
  baseUrl: "https://khoj.atlassian.net"
  email: "anuj.gupta9860@gmail.com"   # Atlassian account email the API token belongs to
  projectKey: "RAG"                   # default project for new tickets (the "Rag" project on this site)
  issueType: "Task"                   # issue type created by the button
  secretName: khoj-jira               # k8s Secret the ExternalSecret creates
  externalSecret:
    enabled: true
    gsmKey: khoj-jira-api-token       # Google Secret Manager secret holding the API token
    refreshInterval: 1h

workloadIdentity:
  # Google service account the pods act as (storage object admin on the
  # bucket, firestore, firebase auth)
  gsaEmail: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  host: ""            # e.g. khoj.example.com; empty = IP-only via LB address
  staticIpName: ""    # GKE reserved static IP name, optional

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"
