# Patched backend image built by cloudbuild.yaml from
# deploy/docker/Dockerfile.backend (tags: SHORT_SHA + latest).
image: us-central1-docker.pkg.dev/innovation-lab-2026/khoj/openrag-backend:latest
opensearchUrl: https://opensearch:9200
opensearchHost: opensearch
opensearchPort: "9200"
langflowUrl: http://langflow:7860
langflowSuperuser: langflow
doclingUrl: http://docling:5001
llm:
  provider: openai
  model: gpt-4o-mini
  embeddingProvider: openai
  embeddingModel: text-embedding-3-small
# No secrets in values: credentials sync from Google Secret Manager via
# External Secrets Operator (templates/externalsecret.yaml).
persistence:
  enabled: true
  size: 10Gi
  mountPath: /app/openrag-documents
resources:
  requests: { cpu: "500m", memory: "1Gi" }
  limits: { cpu: "2", memory: "4Gi" }
