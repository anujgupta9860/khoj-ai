{{- if .Values.openai.externalSecret.enabled }}
# The OpenAI key comes from Google Secret Manager via External
# Secrets Operator - never from values. Same GSM secret OpenRAG uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.openai.secretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcpsm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.openai.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef: { key: {{ .Values.openai.externalSecret.gsmKey }} }
{{- end }}
