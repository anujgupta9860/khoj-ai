image:
  repository: us-central1-docker.pkg.dev/innovation-lab-2026/khoj/khoj-agent
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 1

gcp:
  project: innovation-lab-2026
  bucket: "khoj-ai-corpus-innovation-lab"

# OpenRAG: the single retrieval engine (in-cluster service)
openrag:
  url: "http://openrag-backend:8000"

openai:
  # Answer model. The API key arrives via External Secrets Operator
  # from Google Secret Manager (the same key OpenRAG uses) into the
  # k8s Secret named here -- never in values/git. When the secret is
  # absent the agent answers extractively from the source files.
  model: "gpt-4o-mini"
  secretName: "khoj-agent-openai"
  externalSecret:
    enabled: true
    gsmKey: "openrag-openai-api-key"

workloadIdentity:
  # Same app GSA as the web service (Firestore + Firebase Auth +
  # storage reads on the corpus bucket for the extractive fallback)
  gsaEmail: ""

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"
