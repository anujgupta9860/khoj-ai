apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langflow-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcpsm
    kind: ClusterSecretStore
  target:
    name: langflow-secrets
    creationPolicy: Owner
  data:
    - secretKey: LANGFLOW_SUPERUSER_PASSWORD
      remoteRef: { key: openrag-langflow-superuser-password }
