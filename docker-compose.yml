services:
  khoj:
    build: .
    container_name: khoj
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      GCP_PROJECT: ${GCP_PROJECT}
      KHOJ_BUCKET: ${KHOJ_BUCKET}
      OPENRAG_URL: ${OPENRAG_URL:-http://openrag-backend:8000}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
