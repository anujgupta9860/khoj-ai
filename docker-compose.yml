services:
  khoj:
    build: .
    container_name: khoj
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      GCP_PROJECT: ${GCP_PROJECT}
      KHOJ_ENGINE_ID: ${KHOJ_ENGINE_ID}
      KHOJ_DATASTORE_ID: ${KHOJ_DATASTORE_ID}
      KHOJ_BUCKET: ${KHOJ_BUCKET}
      KHOJ_LOCATION: ${KHOJ_LOCATION:-global}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
